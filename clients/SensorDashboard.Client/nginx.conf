# Serves the built dashboard and proxies /api (REST + SignalR) to the API container, so the
# browser talks to a single origin, as with the Vite dev proxy.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve the API through Docker's DNS per request, so nginx starts even before the
    # API container is up (a static proxy_pass host would fail at startup).
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8080;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # SignalR WebSocket upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/warehouses/..., /alerts) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
