# Whole system in one command:  docker compose up --build
#   Dashboard  http://localhost:8080
#   API        http://localhost:5278   (/health, /ingest/stats, ...)
#   SQL Server localhost,14333         (sa / SA_PASSWORD; 14333 avoids a local SQL Server on 1433)
#
# SA_PASSWORD defaults to a development-only value; override it in a .env file or the shell.

name: iot-digital-twin

# Rotate container logs so a long-running stack can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-connection-string: &connection-string "Server=sqlserver,1433;Database=IoTDigitalTwin;User Id=sa;Password=${SA_PASSWORD:-DevOnly_Passw0rd!};TrustServerCertificate=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-DevOnly_Passw0rd!}
      # Cap SQL Server's memory so it can't starve the other containers.
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "14333:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *logging

  # Applies EF Core migrations (schema, partitioning, queue, rollups, seed data), then exits.
  migrate:
    build:
      context: .
      dockerfile: src/SensorDashboard.Api/Dockerfile
      target: migrator
    environment:
      ConnectionStrings__IoTDigitalTwin: *connection-string
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    build:
      context: .
      dockerfile: src/SensorDashboard.Api/Dockerfile
    environment:
      ConnectionStrings__IoTDigitalTwin: *connection-string
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5278:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "SensorDashboard.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *logging

  # Buffers readings (store-and-forward) whenever the API is unreachable.
  simulator:
    build:
      context: .
      dockerfile: src/SensorSimulator/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      Simulator__IngestBaseUrl: http://api:8080
      Simulator__IntervalSeconds: ${SIM_INTERVAL_SECONDS:-5}
      Simulator__AnomalyProbability: ${SIM_ANOMALY_PROBABILITY:-0.02}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  dashboard:
    build: ./clients/SensorDashboard.Client
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

  # Outside-in uptime probe: checks the API and dashboard every 15 s from outside the API
  # process and logs each UP/DOWN change (`docker compose logs uptime-probe`), so an outage is
  # recorded even when the API itself can't record anything.
  uptime-probe:
    image: curlimages/curl:8.11.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        api=; dash=
        while true; do
          s=$$(curl -fsS -m 5 -o /dev/null http://api:8080/health 2>/dev/null && echo UP || echo DOWN)
          if [ "$$s" != "$$api" ]; then echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) api $$s"; api=$$s; fi
          s=$$(curl -fsS -m 5 -o /dev/null http://dashboard/ 2>/dev/null && echo UP || echo DOWN)
          if [ "$$s" != "$$dash" ]; then echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) dashboard $$s"; dash=$$s; fi
          sleep 15
        done
    depends_on:
      - api
      - dashboard
    restart: unless-stopped
    logging: *logging

volumes:
  sqldata:
