name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Development-only password for throwaway CI containers.
  SA_PASSWORD: CiOnly_Passw0rd!
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    services:
      # Integration tests need real SQL Server (partitioning, columnstore, DATE_BUCKET).
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ env.SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore IoTDigitalTwin.slnx
      - run: dotnet build IoTDigitalTwin.slnx --no-restore -c Release
      - name: Test
        # Each run creates and drops its own database on this server.
        env:
          IOT_TEST_SQL: Server=localhost,1433;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True
        run: >-
          dotnet test IoTDigitalTwin.slnx --no-build -c Release
          --logger "trx;LogFilePrefix=results" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  client:
    name: Dashboard lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/SensorDashboard.Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/SensorDashboard.Client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [dotnet, client]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the API to be healthy (database migrated)
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5278/health && exit 0
            sleep 5
          done
          echo "API never became healthy" && exit 1
      - name: Simulator readings flow through the queue into storage
        run: |
          for i in $(seq 1 24); do
            inserted=$(curl -fsS http://localhost:5278/ingest/stats | jq '.processed.readingsInserted')
            echo "readings inserted: $inserted"
            [ "$inserted" -gt 0 ] && exit 0
            sleep 5
          done
          exit 1
      - name: Dashboard serves the app and proxies the API
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/warehouses/WH-SEA | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/warehouses | jq -e 'length == 3'
      - name: Chaos test (API and database outages lose no readings)
        run: OUTAGE_SECONDS=20 bash scripts/chaos-test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
